<title>Melsa Elevators — Company Profile</title>

<style>
/* Melsa company profile — print to A4 (rendered to PDF by tools/profile/build.mjs) */
@page{size:A4;margin:0}
:root{--navy:#0B1D35;--deep:#172A40;--silver:#AEB5BE;--gold:#C5AD87;--red:#A82935;--ivory:#F5F4F0;--ink:#0B1D35;--muted:#5E6670;--line:#DDDCD5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
body{font-family:Inter,'IBM Plex Sans Arabic',sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;letter-spacing:-.01em}
[dir=rtl] body,[dir=rtl]{font-family:'IBM Plex Sans Arabic',Inter,sans-serif;letter-spacing:0}
.pg{width:210mm;height:297mm;position:relative;overflow:hidden;background:var(--ivory);page-break-after:always;break-after:page;margin:0 auto}
@media screen{.pg{margin:10mm auto;box-shadow:0 10px 40px #0005}}
.pad{position:absolute;inset:22mm 18mm 20mm}
img{display:block;max-width:100%}
.cover-img,.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1,h2,h3{font-weight:700;letter-spacing:-.035em;line-height:1.04}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{letter-spacing:0;line-height:1.3}
h2{font-size:40pt;color:var(--navy)}
h3{font-size:14pt;color:var(--navy);letter-spacing:-.02em}
p{font-size:10.5pt;line-height:1.6;color:var(--muted)}
.eyebrow{font-size:10pt;font-weight:600;color:var(--red);margin-bottom:5mm;display:flex;align-items:center;gap:3mm}
.eyebrow b{font-weight:600;color:var(--gold)}
.lead{font-size:13pt;line-height:1.55;color:var(--muted);max-width:150mm}
.dark{background:var(--navy);color:#fff}.dark h2,.dark h3{color:#fff}.dark p,.dark .lead{color:#C9CED5}
.deep{background:var(--deep)}
/* running header/footer */
.run{position:absolute;left:18mm;right:18mm;top:10mm;display:flex;justify-content:space-between;align-items:center;font-size:8pt;color:var(--muted);z-index:3}
.run img{height:11mm}
.foot{position:absolute;left:18mm;right:18mm;bottom:9mm;display:flex;justify-content:space-between;font-size:8pt;color:var(--muted);border-top:.3mm solid var(--line);padding-top:3mm;z-index:3}
.dark .foot,.dark .run{color:var(--silver)}.dark .foot{border-color:#ffffff22}
.hair{height:.4mm;width:22mm;background:var(--gold);margin:6mm 0}
/* cover */
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0b1d35b3 0%,#0b1d3500 22%,#0b1d3500 34%,#0b1d35d9 66%,#0b1d35 100%)}
.cover .top{position:absolute;top:16mm;left:18mm;right:18mm;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;font-size:9pt;letter-spacing:.2em;text-transform:uppercase}
[dir=rtl] .cover .top{letter-spacing:0}
.cover .top img{height:30mm}
.cover .txt{position:absolute;left:18mm;right:18mm;bottom:24mm;color:#fff}
.cover h1{font-size:58pt;color:#fff}
.cover .sub{font-size:14pt;color:#E6E4DE;margin-top:6mm;max-width:140mm;line-height:1.5}
.cover .since{display:flex;gap:10mm;margin-top:12mm;font-size:9pt;color:var(--silver)}
.cover .since b{display:block;direction:ltr;unicode-bidi:isolate;color:#fff;font-size:20pt;font-weight:700;letter-spacing:-.03em;margin-bottom:1mm}
/* contents */
.toc{margin-top:14mm;display:grid;gap:0}
.toc div{display:flex;align-items:baseline;gap:6mm;padding:4.2mm 0;border-bottom:.3mm solid var(--line)}
.toc span{font-size:10pt;color:var(--gold);font-weight:600;width:10mm}
.toc b{font-size:15pt;font-weight:600;flex:1;letter-spacing:-.02em}
.toc i{font-style:normal;font-size:10pt;color:var(--muted)}
/* numbers */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-top:10mm}
.nums div{background:#fff;border-radius:5mm;padding:7mm 5mm;text-align:center}
.nums b{display:block;font-size:26pt;font-weight:800;letter-spacing:-.04em;background:linear-gradient(120deg,var(--navy) 30%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.nums span{display:block;font-size:8.5pt;color:var(--muted);margin-top:2mm}
.photo{border-radius:6mm;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;bottom:4mm;left:4mm;background:#0b1d35b3;color:#fff;font-size:8pt;padding:1.5mm 3.5mm;border-radius:10mm}
[dir=rtl] .cap{left:auto;right:4mm}
/* founder */
.founder{display:grid;grid-template-columns:68mm 1fr;gap:12mm;align-items:start}
.founder .photo{height:92mm;background:#fff}
.founder .photo img{object-position:top}
.quote{font-size:30pt;color:var(--gold);line-height:.4;font-family:Georgia,serif;display:block;height:9mm}
.sig{margin-top:7mm;padding-top:5mm;border-top:.3mm solid #ffffff22}
.sig b{display:block;color:#fff;font-size:12pt}.sig span{font-size:9pt;color:var(--silver)}
/* cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.card{background:#fff;border-radius:5mm;padding:7mm 6mm}
.card .n{font-size:20pt;font-weight:300;color:var(--gold);letter-spacing:-.02em;margin-bottom:3mm;direction:ltr;display:block}
[dir=rtl] .card .n{text-align:right}
.card p{font-size:9.5pt;margin-top:2mm}
.dark .card{background:#ffffff0d;border:.3mm solid #ffffff1a}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:9mm}
.svc .card{padding:0;overflow:hidden}
.svc .card img{height:62mm;width:100%;object-fit:cover}
.svc .card div{padding:5mm 6mm 6mm}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:9mm}
.types .card{padding:0;overflow:hidden;text-align:center}
.types .card img{height:62mm;width:100%;object-fit:contain;background:#fff;padding:3mm}
.types .card img.cov{object-fit:cover;padding:0}
.types .card div{padding:4mm 4mm 5mm}
.types .card p{font-size:8.5pt}
/* finishes */
.fin h3{margin:7mm 0 3mm;font-size:12pt}
.fin .row{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.fin .row div{background:#fff;border-radius:3.5mm;overflow:hidden}
.fin .row img{height:34mm;width:100%;object-fit:contain;padding:2mm;mix-blend-mode:multiply}
.fin .row img.cov{object-fit:cover;padding:0;mix-blend-mode:normal}
.fin .row span{display:block;font-size:7.5pt;color:var(--muted);padding:0 3mm 2.5mm;line-height:1.3}
/* process */
.steps{margin-top:10mm;position:relative}
.steps::before{content:"";position:absolute;top:4mm;bottom:4mm;inset-inline-start:6mm;width:.4mm;background:linear-gradient(var(--gold),var(--red))}
.step{display:flex;gap:9mm;align-items:flex-start;padding:5.2mm 0;position:relative}
.step i{flex:none;width:12.5mm;height:12.5mm;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-weight:600;font-size:10pt;display:grid;place-items:center;position:relative;z-index:1;border:.6mm solid var(--ivory);direction:ltr}
.step h3{font-size:13pt;margin-top:1.5mm}
.step p{font-size:9.5pt;margin-top:1mm;max-width:140mm}
/* projects */
.proj{display:grid;grid-template-columns:1fr 1fr;gap:4mm;height:120mm;margin-top:8mm}
.proj .photo{height:100%}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-top:5mm}
.facts div{border-top:.4mm solid var(--gold);padding-top:2.5mm}
.facts small{display:block;font-size:7.5pt;color:var(--muted)}
.facts b{font-size:10pt;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:7mm}
.mini .photo{height:62mm}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin-top:8mm}
.logos div{background:#fff;border-radius:3.5mm;height:22mm;display:grid;place-items:center;padding:3mm}
.logos img{max-height:15mm;max-width:100%;object-fit:contain}
/* team */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-top:10mm}
.team .photo{height:72mm;background:#fff}
.team .photo img{object-position:top}
.team b{display:block;font-size:12pt;margin-top:4mm}.team span{font-size:9pt;color:var(--muted)}
/* contact */
.contact{position:absolute;left:18mm;right:18mm;bottom:30mm}
.contact h2{font-size:46pt}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:6mm 10mm;margin-top:12mm}
.clist div small{display:block;font-size:8pt;color:var(--silver);margin-bottom:1mm}
.clist div b{font-size:12pt;font-weight:500;color:#fff;direction:ltr;unicode-bidi:isolate}
.clist div b.rtl{direction:inherit}
</style>
