<main>
 <div class="page-head"><div class="wrap"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="h1"></h1><p class="lead" data-i18n="lead"></p></div></div>
 <section><div class="wrap cgrid2">
  <div>
   <h2 style="margin:0;font-size:22px" data-i18n="topicsTitle"></h2>
   <p style="margin:2px 0 12px;color:var(--muted)" data-i18n="topicsSub"></p>

   <div class="how"><div><b>1</b><span data-i18n="how1"></span></div><div><b>2</b><span data-i18n="how2"></span></div><div><b>3</b><span data-i18n="how3"></span></div></div>
  </div>

   <h2 style="margin-top:0;font-size:22px" data-i18n="formTitle"></h2>

    <div class="row"><div><label for="n" data-i18n="name"></label><input id="n" required autocomplete="name"></div><div><label for="ph" data-i18n="phone"></label><input id="ph" type="tel" inputmode="tel" required autocomplete="tel"></div></div>

     <div><label for="bt" data-i18n="building"></label><select id="bt" data-opts="b"><option value="Residential"></option><option value="Villa"></option><option value="Hospital"></option><option value="Mall"></option><option value="Office"></option><option value="Hotel"></option><option value="Factory"></option></select></div>

   </form>
  </div>
 </div></section>

<script>
(function(){
 const {t,esc,send,toast}=Melsa;
 const TOPICS=[["New","🏗️"],["Modern","⚙️"],["Specs","📋"],["Shaft","📐"],["Inspect","🔍"],["Contract","📝"],["Quote","💬"],["Other","❓"]];
 const CONTACT=["Call","WhatsApp","Visit"];
 const picked=new Set(), how=new Set(["WhatsApp"]);
 const q=new URLSearchParams(location.search).get("topic"); if(q&&TOPICS.some(x=>x[0]===q))picked.add(q);
 function render(){
  document.getElementById("topics").innerHTML=TOPICS.map(([k,ic])=>`<button type="button" class="tp" data-k="${k}" aria-pressed="${picked.has(k)}"><span class="ic">${ic}</span><span><h3>${esc(t("t."+k))}</h3><p>${esc(t("t."+k+"t"))}</p></span></button>`).join("");
  document.getElementById("contact").innerHTML=CONTACT.map(k=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${how.has(k)}">${esc(t("c."+k))}</button>`).join("");
  document.getElementById("de").placeholder=t("detailsPh");
 }
 render(); window.addEventListener("melsa:lang",render);
 document.getElementById("topics").addEventListener("click",e=>{const b=e.target.closest(".tp");if(!b)return;const k=b.dataset.k;picked.has(k)?picked.delete(k):picked.add(k);b.setAttribute("aria-pressed",picked.has(k));});
 document.getElementById("contact").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.c;how.has(k)?how.delete(k):how.add(k);b.setAttribute("aria-pressed",how.has(k)); feeUpd();});
 function feeUpd(){document.getElementById("fee").classList.toggle("on",how.has("Visit"));} feeUpd();
 document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault(); const v=id=>document.getElementById(id).value.trim(), o=id=>{const s=document.getElementById(id);return s.options[s.selectedIndex].textContent;};
  if(!picked.size){toast(t("pickTopic"));document.getElementById("topics").scrollIntoView({block:"center"});return;}
  if(!v("n")||!v("ph")){toast(t("required"));return;}
  const text=[t("msgHead"),"",t("topicsLbl")+": "+TOPICS.filter(x=>picked.has(x[0])).map(x=>t("t."+x[0])).join(" + "),
   t("name")+": "+v("n"),t("phone")+": "+v("ph"),v("ar")?t("area")+": "+v("ar"):"",t("building")+": "+o("bt"),t("stage")+": "+o("sg"),
   how.size?t("contact")+": "+CONTACT.filter(k=>how.has(k)).map(k=>t("c."+k)).join(" / "):"",how.has("Visit")?t("feeAck"):"",v("de")?"\n"+v("de"):""].filter(Boolean).join("\n");
  send(t("msgHead"),text);
 });
})();
</script>
