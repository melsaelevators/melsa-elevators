<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects | Melsa Elevators</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#023584">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pj{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:start;padding:0;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column}
.pj img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f5}
.pj .body{padding:14px 16px}.pj h3{margin:0 0 4px}.pj p{margin:0;color:var(--muted);font-size:13.5px}
.pj .meta{font-size:12px;font-weight:800;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
</style>
<script>
window.PAGE_T={
 en:{title:"Projects | Melsa Elevators",eyebrow:"Projects",h1:"Our work",lead:"A selection of elevators designed and installed by Melsa.",all:"All",
  emptyTitle:"Project photos coming soon",emptyText:"We are adding photos of our recent installations.",cta:"Start your project"},
 ar:{title:"مشاريعنا | ميلسا للمصاعد",eyebrow:"مشاريعنا",h1:"أعمالنا",lead:"مختارات من المصاعد اللي صممتها وركبتها ميلسا.",all:"الكل",
  emptyTitle:"صور المشاريع قريبًا",emptyText:"بنضيف صور أحدث التركيبات بتاعتنا.",cta:"ابدأ مشروعك"}
};
</script>
</head>
<body data-page="projects">
<main>
 <div class="page-head"><div class="wrap"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="h1"></h1><p class="lead" data-i18n="lead"></p></div></div>
 <section><div class="wrap"><div class="tabs" id="tabs"></div><div id="list"></div></div></section>
</main>
<script src="assets/site-data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
 const {t,esc,lang,site,lightbox}=Melsa, list=site.projects||[];
 let cur="all";
 const f=(p,k)=>lang()==="ar"?(p[k+"_ar"]||p[k+"_en"]||""):(p[k+"_en"]||p[k+"_ar"]||"");
 function render(){
  const box=document.getElementById("list"), tabs=document.getElementById("tabs");
  if(!list.length){tabs.innerHTML="";box.innerHTML=`<div class="empty"><strong>${esc(t("emptyTitle"))}</strong>${esc(t("emptyText"))}<div class="btns" style="justify-content:center"><a class="btn red" href="contact.html">${esc(t("cta"))}</a></div></div>`;return;}
  const types=[...new Set(list.map(p=>p.type).filter(Boolean))];
  tabs.innerHTML=types.length>1?["all",...types].map(k=>`<button type="button" class="tab" data-k="${k}" aria-pressed="${k===cur}">${esc(k==="all"?t("all"):t("t."+k))}</button>`).join(""):"";
  const shown=list.map((p,i)=>({p,i})).filter(x=>cur==="all"||x.p.type===cur);
  box.innerHTML=`<div class="grid3">${shown.map(({p,i})=>`<button type="button" class="pj" data-i="${i}"><img src="${esc(p.photos?.[0]||"")}" alt="" loading="lazy">
   <div class="body"><div class="meta">${esc([p.type?t("t."+p.type):"",p.year].filter(Boolean).join(" · "))}</div><h3>${esc(f(p,"title"))}</h3><p>${esc(f(p,"place"))}</p>${f(p,"text")?`<p style="margin-top:6px">${esc(f(p,"text"))}</p>`:""}</div></button>`).join("")}</div>`;
 }
 document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.k;render();});
 document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".pj");if(!b)return;const p=list[+b.dataset.i];if(p.photos?.length)lightbox(p.photos,0,f(p,"title"));});
 render(); window.addEventListener("melsa:lang",render);
})();
</script>
</body>
</html>
