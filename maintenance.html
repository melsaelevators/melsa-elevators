<script>
(function(){
 const {t,esc,site,send,toast}=Melsa, C=site.company||{};
 const issue=document.getElementById("is"), alertBox=document.getElementById("alert");
 function upd(){const tr=issue.value==="Trapped"; alertBox.hidden=!tr; if(tr){document.getElementById("ur").value="Urgent";
  alertBox.innerHTML=C.phone?`${esc(t("trapped"))}: <a href="tel:${esc(C.phone.replace(/[^\d+]/g,""))}">${esc(C.phone)}</a>`:esc(t("trappedNoPhone"));}}
 issue.addEventListener("change",upd); window.addEventListener("melsa:lang",upd); upd();
 document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault(); const v=id=>document.getElementById(id).value.trim(), o=id=>{const s=document.getElementById(id);return s.options[s.selectedIndex].textContent;};
  if(!v("n")||!v("ph")){toast(t("required"));return;}
  const text=[t("msgHead"),"",t("name")+": "+v("n"),t("phone")+": "+v("ph"),v("ar")?t("area")+": "+v("ar"):"",t("building")+": "+o("bt"),t("drive")+": "+o("dr"),
   v("br")?t("brand")+": "+v("br"):"",t("issue")+": "+o("is"),t("urgency")+": "+o("ur"),v("de")?"\n"+v("de"):""].filter(Boolean).join("\n");
  send(t("msgHead"),text);
 });
})();
</script>
