<script>
(function(){
 const {t,esc,send,toast,lightbox}=Melsa, P=window.MELSA_PRODUCTS||{};
 const pick={}; // catalog choices: door / floor / panel -> product id
 const prodName=p=>(Melsa.lang()==="ar"?p.ar:p.label);
 function catList(c){if(c==="panel")return (P.panel||[]).filter(p=>p.kind!=="COP"); if(c==="cop")return (P.panel||[]).filter(p=>p.kind==="COP"); const list=P[c]||[]; if(c!=="door"||!sel.doors)return list; const ty=sel.doors==="Semi"?"Semi-automatic":"Automatic"; return list.filter(p=>p.type===ty);}
 function renderCat(){
  document.querySelectorAll(".cat[data-c]").forEach(box=>{const c=box.dataset.c, list=catList(c);
   if(pick[c]&&!list.some(p=>p.id===pick[c]))delete pick[c];
   box.innerHTML=list.map(p=>`<button type="button" class="ci" data-id="${p.id}" aria-pressed="${pick[c]===p.id}" title="${esc(prodName(p))}"><img src="assets/thumbs/${p.id}.jpg" alt="${esc(prodName(p))}" loading="lazy"><b>${esc(t("code",{c:p.code}))}</b><span class="zoom" data-zoom="${p.id}" aria-label="zoom">🔍</span></button>`).join("");
   if(c==="door"){const p=list.find(x=>x.id===pick.door); if(!p||!p.variants)delete pick.doorV;
    if(p&&p.variants)box.insertAdjacentHTML("beforeend",`<div class="dvars"><span>${esc(t("doorColor"))}</span>${p.variants.map((v,k)=>`<button type="button" class="dv" data-v="${k}" aria-pressed="${pick.doorV===k}" title="${esc(prodName(v))}"><img src="assets/thumbs/${v.id}.jpg" alt="${esc(prodName(v))}"><small>${esc(prodName(v))}</small></button>`).join("")}</div>`);}});
  document.getElementById("doorNote").textContent=sel.doors?t("doorNote."+sel.doors):t("doorNoteAll");
 }
 function catLines(){const L=[]; [["cabin","cabinDesign"],["door","doorDesign"],["floor","floorDesign"],["panel","panelDesign"],["cop","copDesign"]].forEach(([c,k])=>{const p=Object.values(P).flat().find(x=>x.id===pick[c]); if(!p)return; const v=c==="door"&&p.variants&&pick.doorV!=null?p.variants[pick.doorV]:null; L.push(t(k)+": "+t("code",{c:v?"\u2066"+p.code+"-"+v.v+"\u2069":p.code})+(v?" — "+prodName(v):""));}); return L;}
 const sel={}; const groups=[...document.querySelectorAll(".opts[data-g]")];
 const ORDER=["drive","doors","rails","machine","ropes","finish","cabinWork","panels","controller"];
 const SW={Mirror:"linear-gradient(135deg,#ffffff,#b9c1c8 45%,#f4f6f8)",Hairline:"repeating-linear-gradient(90deg,#c9ced3 0 2px,#b3b9bf 2px 3px)",Bronze:"linear-gradient(135deg,#d0a17a,#644733)",Black:"linear-gradient(135deg,#55575b,#17191e)"};
 const electric=()=>sel.drive!=="Hydraulic";
 function renderOpts(){
  groups.forEach(box=>{const g=box.dataset.g, multi=box.hasAttribute("data-multi");
   box.innerHTML=box.dataset.v.split(",").map(v=>{const on=multi?(sel[g]||[]).includes(v):sel[g]===v;
    return `<button type="button" class="opt" data-v="${v}" aria-pressed="${on}">${g==="finish"?`<span class="sw" style="background:${SW[v]}"></span>`:""}${esc(t("o."+g+"."+v))}</button>`;}).join("");});
  document.querySelectorAll("[data-electric]").forEach(q=>q.hidden=!electric());
  renderCat();
  document.getElementById("send").textContent=t("send"); document.getElementById("clear").textContent=t("reset");
  renderSum();
 }
 function lines(){
  const L=[];
  ORDER.forEach(g=>{ if((g==="machine"||g==="ropes")&&!electric())return; const v=sel[g]; if(!v||(Array.isArray(v)&&!v.length))return;
   const label=document.querySelector(`.opts[data-g=${g}]`).closest(".q").querySelector(".ql [data-i18n], .ql")?.dataset?.i18n||g;
   L.push(t(g)+": "+(Array.isArray(v)?v.map(x=>t("o."+g+"."+x)).join(" + "):t("o."+g+"."+v)));});
  return L.concat(catLines());
 }
 function renderSum(){const L=lines();document.getElementById("sum").textContent=L.length?L.join("\n"):"—";}
 document.addEventListener("click",e=>{
  const z=e.target.closest("[data-zoom]"); if(z){e.stopPropagation(); const p=Object.values(P).flat().find(x=>x.id===z.dataset.zoom); if(p)lightbox(["assets/"+p.id+"."+p.ext],0,t("code",{c:p.code})+" — "+prodName(p)); return;}
  const dv=e.target.closest(".dv"); if(dv){const k=+dv.dataset.v; pick.doorV=pick.doorV===k?undefined:k; if(pick.doorV==null)delete pick.doorV; renderOpts(); return;}
  const ci=e.target.closest(".ci"); if(ci){const c=ci.closest(".cat").dataset.c; pick[c]=pick[c]===ci.dataset.id?undefined:ci.dataset.id; if(!pick[c])delete pick[c]; renderOpts(); return;}
  const b=e.target.closest(".opt"); if(!b)return; const box=b.closest(".opts"), g=box.dataset.g, v=b.dataset.v;
  if(box.hasAttribute("data-multi")){const a=sel[g]||[];sel[g]=a.includes(v)?a.filter(x=>x!==v):[...a,v];} else sel[g]=sel[g]===v?undefined:v;
  renderOpts();
 });
 document.getElementById("clear").addEventListener("click",()=>{for(const k in sel)delete sel[k];for(const k in pick)delete pick[k];document.getElementById("form").reset();renderOpts();scrollTo({top:0,behavior:"smooth"});});
 document.getElementById("send").addEventListener("click",()=>{
  const v=id=>document.getElementById(id).value.trim(), o=id=>{const s=document.getElementById(id);return s.options[s.selectedIndex].textContent;};
  const L=lines(); if(!L.length){toast(t("nothing"));return;}
  if(!v("n")||!v("ph")){toast(t("required"));document.getElementById("n").focus();return;}
  const text=[t("msgHead"),"",...L,"",t("name")+": "+v("n"),t("phone")+": "+v("ph"),v("ar")?t("area")+": "+v("ar"):"",t("building")+": "+o("bt"),
   v("st")?t("stops")+": "+v("st"):"",v("cp")?t("capacity")+": "+v("cp"):"",v("no")?"\n"+v("no"):""].filter(x=>x!=="").join("\n");
  Melsa.crmLead({kind:"quote",name:v("n"),phone:v("ph"),area:v("ar"),subject:"Quote",message:text});
  send(t("msgHead"),text);
 });
 renderOpts(); window.addEventListener("melsa:lang",renderOpts);
})();
</script>
