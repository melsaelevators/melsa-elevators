<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clients | Melsa Elevators</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#023584">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.cl{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;text-align:center;min-height:210px}
.cl .lg{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.cl img{max-height:120px;max-width:88%;object-fit:contain}
.cl .ini{width:64px;height:64px;border-radius:50%;background:var(--tint);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:22px}
.cl b{color:var(--navy);font-size:14.5px}
button.cl{font:inherit;cursor:pointer;width:100%;transition:transform .15s,box-shadow .15s,border-color .15s}
button.cl:hover,button.cl:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px #02358422;border-color:var(--navy)}
.cl .more{font-size:12px;font-weight:700;color:var(--red)}
.pm{position:fixed;inset:0;z-index:80;background:#0a1730cc;display:flex;align-items:center;justify-content:center;padding:16px}
.pm[hidden]{display:none}
.pm-box{background:#fff;border-radius:18px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;border-top:5px solid var(--red)}
.pm-head{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.pm-head img{height:54px;width:auto;max-width:120px;object-fit:contain}
.pm-head h2{margin:0;font-size:20px;flex:1}
.pm-close{border:0;background:var(--tint);color:var(--navy);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
.pm-body{padding:18px}
.pm-text{color:var(--muted);margin:0 0 14px}
.pm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pm-grid button{border:0;padding:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#eef1f5}
.pm-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
@media(max-width:600px){.pm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cgroup{margin-bottom:34px;scroll-margin-top:96px}
.cgroup h2{display:flex;align-items:center;gap:12px;font-size:clamp(20px,2.6vw,26px);margin:0 0 14px;padding-inline-start:12px;border-inline-start:5px solid var(--red)}
.cgroup h2 span{font-size:12px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.jump a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;text-decoration:none;color:var(--navy)}
.jump a:hover{background:var(--tint)}
</style>
<script>
window.PAGE_T={
 en:{title:"Clients | Melsa Elevators",eyebrow:"Clients",h1:"Who we work with",lead:"Developers, building owners, hospitals and businesses who trust Melsa Elevators. Tap a logo to see the elevators we installed for them.",
  viewPhotos:"View project →",photosN:"{n} photos",noPhotos:"Project photos coming soon.",close:"Close",
  emptyTitle:"Our client list is being updated",emptyText:"Want to be one of them?",cta:"Contact us",
  "c.hospitals":"Hospitals","c.education":"Universities & education","c.industry":"Factories & industry","c.construction":"Construction & real estate","c.gov":"Government, syndicates & associations","c.business":"Hotels & companies","c.other":"Other clients"},
 ar:{title:"عملاؤنا | ميلسا للمصاعد",eyebrow:"عملاؤنا",h1:"بنشتغل مع مين",lead:"مطورين وملاك مباني ومستشفيات وشركات بيثقوا في ميلسا للمصاعد. اضغط على أي لوجو تشوف المصاعد اللي ركبناها عندهم.",
  viewPhotos:"شوف المشروع ←",photosN:"{n} صورة",noPhotos:"صور المشروع قريبًا.",close:"إغلاق",
  emptyTitle:"قائمة العملاء قيد التحديث",emptyText:"عايز تكون واحد منهم؟",cta:"تواصل معنا",
  "c.hospitals":"المستشفيات","c.education":"الجامعات والتعليم","c.industry":"المصانع والصناعة","c.construction":"المقاولات والتطوير العقاري","c.gov":"جهات حكومية ونقابات وجمعيات","c.business":"فنادق وشركات","c.other":"عملاء آخرون"}
};
</script>
</head>
<body data-page="clients">
<main>
 <div class="page-head"><div class="wrap"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="h1"></h1><p class="lead" data-i18n="lead"></p></div></div>
 <section><div class="wrap"><div id="list"></div></div></section>
 <div class="pm" id="pm" hidden role="dialog" aria-modal="true" aria-labelledby="pmTitle">
  <div class="pm-box"><div class="pm-head"><img id="pmLogo" alt=""><h2 id="pmTitle"></h2><button type="button" class="pm-close" id="pmClose" aria-label="Close">×</button></div>
  <div class="pm-body"><p class="pm-text" id="pmText"></p><div class="pm-grid" id="pmGrid"></div></div></div>
 </div>
</main>
<script src="assets/site-data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
 const {t,esc,lang,site,lightbox}=Melsa;
 const nm=c=>lang()==="ar"?(c.name_ar||c.name_en):(c.name_en||c.name_ar);
 function render(){
  const L=lang(), list=site.clients||[], box=document.getElementById("list");
  if(!list.length){box.innerHTML=`<div class="empty"><strong>${esc(t("emptyTitle"))}</strong>${esc(t("emptyText"))}<div class="btns" style="justify-content:center"><a class="btn red" href="contact.html">${esc(t("cta"))}</a></div></div>`;return;}
  const card=c=>{const n=nm(c), ph=(c.photos||[]).length;
   return `<button type="button" class="cl" data-i="${list.indexOf(c)}">${c.logo?`<span class="lg"><img src="${esc(c.logo)}" alt="${esc(n)}" loading="lazy"></span>`:`<span class="ini">${esc((n||"?").trim().charAt(0))}</span>`}<b>${esc(n)}</b><span class="more">${esc(ph?t("photosN",{n:ph})+" · "+t("viewPhotos"):t("viewPhotos"))}</span></button>`;};
  const order=["hospitals","education","industry","construction","gov","business","other"];
  const groups=order.map(k=>({k,items:list.filter(c=>(order.includes(c.cat)?c.cat:"other")===k)})).filter(g=>g.items.length);
  box.innerHTML=`<nav class="jump">${groups.map(g=>`<a href="#g-${g.k}">${esc(t("c."+g.k))}</a>`).join("")}</nav>`+
   groups.map(g=>`<div class="cgroup" id="g-${g.k}"><h2>${esc(t("c."+g.k))} <span>${g.items.length}</span></h2><div class="grid4">${g.items.map(card).join("")}</div></div>`).join("");
 }
 render(); window.addEventListener("melsa:lang",render);
 // project window
 const pm=document.getElementById("pm"); let cur=null, lastFocus=null;
 function openProject(c){
  cur=c; lastFocus=document.activeElement; const ph=c.photos||[];
  document.getElementById("pmLogo").src=c.logo||""; document.getElementById("pmLogo").hidden=!c.logo;
  document.getElementById("pmTitle").textContent=nm(c);
  const txt=lang()==="ar"?(c.text_ar||c.text_en):(c.text_en||c.text_ar);
  document.getElementById("pmText").textContent=ph.length?(txt||""):t("noPhotos"); document.getElementById("pmText").hidden=!(ph.length?txt:true);
  document.getElementById("pmGrid").innerHTML=ph.map((src,i)=>`<button type="button" data-p="${i}" aria-label="${esc(nm(c))} ${i+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("");
  pm.hidden=false; document.body.style.overflow="hidden"; document.getElementById("pmClose").focus();
 }
 function closeProject(){pm.hidden=true;document.body.style.overflow="";cur=null;lastFocus&&lastFocus.focus();}
 document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest("button.cl");if(b)openProject((site.clients||[])[+b.dataset.i]);});
 document.getElementById("pmClose").addEventListener("click",closeProject);
 pm.addEventListener("click",e=>{if(e.target===pm)closeProject();const b=e.target.closest("[data-p]");if(b&&cur)lightbox(cur.photos,+b.dataset.p,nm(cur));});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!pm.hidden&&!document.querySelector(".lb"))closeProject();});
 window.addEventListener("melsa:lang",()=>{if(cur)openProject(cur);});
})();
</script>
</body>
</html>
