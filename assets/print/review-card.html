<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Review card | Melsa Elevators</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
@page{size:105mm 148mm;margin:0}
*{box-sizing:border-box}html,body{margin:0;background:#fff}
.card{width:105mm;height:148mm;padding:7mm 8mm 6mm;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:Cairo,sans-serif;color:#023584;border-top:4mm solid #023584;border-bottom:4mm solid #d8031a;position:relative;overflow:hidden;background:#fff}
.logo{width:33mm}
h1{font-size:8.6mm;margin:3mm 0 0;line-height:1.15;font-weight:800}
.en{font-size:4.3mm;color:#d8031a;font-weight:700;margin:1mm 0 0;letter-spacing:.02em}
.stars{color:#fbbc05;font-size:9mm;letter-spacing:1mm;line-height:1;margin:2mm 0 2.5mm}
.qr{width:46mm;height:46mm;border:1.2mm solid #023584;border-radius:4mm;padding:2mm;background:#fff}
.qr img{width:100%;height:100%;display:block}
.how{font-size:3.8mm;color:#34405a;font-weight:700;margin-top:3mm;line-height:1.45}
.g{display:inline-flex;align-items:center;gap:1.5mm;margin-top:auto;font-size:3.2mm;white-space:nowrap;color:#5d6a80;font-weight:700}
.g svg{width:5mm;height:5mm}
.url{font-size:3.6mm;color:#023584;font-weight:800;direction:ltr;margin-top:1mm}
@media screen{body{background:#e9eef6;padding:20px;display:flex;justify-content:center}.card{box-shadow:0 10px 30px #0002}}
</style>
</head>
<body>
<div class="card">
 <img class="logo" src="../logo-full.png" alt="Melsa Elevators">
 <h1>قيّمنا على Google</h1>
 <div class="en">Rate us on Google</div>
 <div class="stars">★★★★★</div>
 <div class="qr"><img src="review-qr.png" alt="QR"></div>
 <div class="how">صوّر الكود بكاميرا الموبايل<br>واكتب رأيك في دقيقة 🙏</div>
 <div class="g"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg><span>إلكتروميلسا لتصميم وتركيب وتوريد وصيانة المصاعد</span></div>
 <div class="url">melsaelevators.com</div>
</div>
</body>
</html>
