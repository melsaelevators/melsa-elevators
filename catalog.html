<head>

<link rel="icon" type="image/png" href="assets/logo-mark.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#023584">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pc button.img{border:0;padding:0;background:#f4f5f7;cursor:zoom-in}
.pc img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.pc.floor img{object-fit:cover}
.pc .body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc .cat{font-size:11px;font-weight:800;color:var(--red);letter-spacing:.08em;text-transform:uppercase}
.pc .name{font-weight:700;font-size:14px;flex:1}
.pc .name.code{font-size:20px;color:var(--navy);letter-spacing:.02em}
.pc a.ask{font-size:12.5px;font-weight:700;text-decoration:none;color:var(--navy);border:1px solid var(--navy);border-radius:9px;padding:7px 10px;text-align:center}
.pc a.ask:hover{background:var(--tint)}
.count{color:var(--muted);font-size:13px;margin:-8px 0 14px}
</style>
<script>
window.PAGE_T={
 en:{title:"Catalog | Melsa Elevators",eyebrow:"Catalog",h1:"Our product collection",lead:"Real Melsa cabins, doors, LOP and COP panels and floor finishes. Every product has a code — just tell us the code. Tap a photo to see it larger.",
  all:"All",cabin:"Cabins",semi:"Semi-automatic doors",auto:"Automatic doors",panel:"LOP",cop:"COP",floor:"Flooring",ask:"Ask about this product",items:"{n} products",code:"Code {c}",
  askMsg:"Hello, I'd like to ask about this product from your catalog: {p}"},
 ar:{title:"الكتالوج | إلكتروميلسا للمصاعد",eyebrow:"الكتالوج",h1:"مجموعة منتجاتنا",lead:"كبائن وأبواب ولوحات LOP وCOP وأرضيات ميلسا الحقيقية. كل منتج ليه كود، قولنا الكود بس. اضغط على أي صورة لتكبيرها.",
  all:"الكل",cabin:"الكبائن",semi:"أبواب نصف أوتوماتيك",auto:"أبواب أوتوماتيك",panel:"LOP",cop:"COP",floor:"الأرضيات",ask:"استفسر عن المنتج",items:"{n} منتج",code:"كود {c}",
  askMsg:"مرحبًا، عايز أستفسر عن المنتج ده من الكتالوج: {p}"}
};
</script>
</head>
<body data-page="catalog">
<main>
 <div class="page-head"><div class="wrap"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="h1"></h1><p class="lead" data-i18n="lead"></p></div></div>
 <section><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <p class="count" id="count"></p>
  <div class="grid4" id="grid"></div>
 </div></section>
</main>
<script src="assets/site-data.js"></script>
<script src="assets/products.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
 const {t,esc,lang,lightbox}=Melsa, P=window.MELSA_PRODUCTS;
 const items=[
  ...(P.cabin||[]).map(p=>({...p,cat:"cabin"})),
  ...P.door.filter(p=>p.type==="Semi-automatic").map(p=>({...p,cat:"semi"})),
  ...P.door.filter(p=>p.type==="Automatic").map(p=>({...p,cat:"auto"})),
  ...P.panel.map(p=>({...p,cat:p.kind==="COP"?"cop":"panel"})), ...P.floor.map(p=>({...p,cat:"floor"}))];
 let cur=new URLSearchParams(location.search).get("cat")||"all";
 const name=p=>p.code?t("code",{c:p.code}):(lang()==="ar"?p.ar:p.label);
 const askName=p=>p.code?t("code",{c:p.code})+" — "+t(p.cat):name(p);
 function render(){
  document.getElementById("tabs").innerHTML=["all","cabin","semi","auto","panel","cop","floor"].map(k=>`<button type="button" class="tab" data-k="${k}" aria-pressed="${k===cur}">${esc(t(k))}</button>`).join("");
  const list=items.filter(p=>cur==="all"||p.cat===cur);
  document.getElementById("count").textContent=t("items",{n:list.length});
  document.getElementById("grid").innerHTML=list.map((p,i)=>`<div class="pc ${p.cat==="floor"?"floor":""}"><button type="button" class="img" data-i="${items.indexOf(p)}" aria-label="${esc(name(p))}"><img src="assets/thumbs/${p.id}.jpg" alt="${esc(name(p))}" loading="lazy"></button>
   <div class="body"><span class="cat">${esc(t(p.cat))}</span><span class="name ${p.code?"code":""}"><bdi>${esc(name(p))}</bdi></span><a class="ask" href="contact.html?subject=Quote&product=${encodeURIComponent(t("askMsg",{p:askName(p)}))}">${esc(t("ask"))}</a></div></div>`).join("");
 }
 document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.k;history.replaceState(null,"","?cat="+cur);render();});
 document.getElementById("grid").addEventListener("click",e=>{const b=e.target.closest("button.img");if(!b)return;const p=items[+b.dataset.i];lightbox([p.src||("assets/"+p.id+"."+p.ext)],0,name(p));});
 render(); window.addEventListener("melsa:lang",render);
})();
</script>
</body>
</html>
