<script>
(function(){
 const {t,esc,lang,lightbox}=Melsa, P=window.MELSA_PRODUCTS;
 const items=[
  ...(P.cabin||[]).map(p=>({...p,cat:"cabin"})),
  ...P.door.filter(p=>p.type==="Semi-automatic").map(p=>({...p,cat:"semi"})),
  ...P.door.filter(p=>p.type==="Automatic").map(p=>({...p,cat:"auto"})),
  ...P.panel.map(p=>({...p,cat:p.kind==="COP"?"cop":"panel"})), ...P.floor.map(p=>({...p,cat:"floor"}))];
 let cur=new URLSearchParams(location.search).get("cat")||"all";
 const name=p=>p.code?t("code",{c:p.code}):(lang()==="ar"?p.ar:p.label);
 const vsel={}; const dflt=p=>p.variants?p.variants.findIndex(v=>v.same):-1; const vIdx=p=>vsel[p.id]??dflt(p); const curV=p=>p.variants&&vIdx(p)>=0?p.variants[vIdx(p)]:null;
 const vName=v=>lang()==="ar"?v.ar:v.label;
 const askName=p=>{const v=curV(p);return (p.code?t("code",{c:v?"\u2066"+p.code+"-"+v.v+"\u2069":p.code})+" — "+t(p.cat):name(p))+(v?" ("+t("colour")+": "+vName(v)+")":"");};
 const imgId=p=>{const v=curV(p);return v?v.id:p.id;};
 const isSS=p=>{const v=curV(p);return /stainless/i.test(v?v.label:p.label);};
 const colorOf=p=>{const v=curV(p);return v?vName(v):(lang()==="ar"?p.ar:p.label);};
 const shortDesc=p=>p.cat==="semi"&&p.win?t("w_"+p.win)+" · "+(isSS(p)?t("ss"):t("paint")):"";
 const allColors=p=>p.variants?p.variants.map(vName).join(lang()==="ar"?"، ":", "):colorOf(p);
 const finishAll=p=>{if(!p.variants)return isSS(p)?t("ssD"):t("paintD");const ss=p.variants.some(v=>/stainless/i.test(v.label)),pt=p.variants.some(v=>!/stainless/i.test(v.label));return ss&&pt?t("paintD")+(lang()==="ar"?" أو ":" or ")+t("ssD"):ss?t("ssD"):t("paintD");};
 const longDesc=p=>p.cat==="semi"&&p.win?t("semiD",{w:t("wd_"+p.win),f:finishAll(p),c:allColors(p)}):p.cat==="auto"?t("autoD",{c:colorOf(p)}):t("genD",{c:colorOf(p)});
 const API="https://melsa-ai.joeadel755.workers.dev", MIN_VIEWS=15;
 let ST={}, HOT=new Set();
 const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>';
 const MSG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>';
 function hotList(){const sc=items.map(p=>{const r=ST[p.id]||{};return [p.id,(r.a||0)*5+(r.v||0),r.v||0];}).filter(x=>x[2]>=MIN_VIEWS).sort((a,b)=>b[1]-a[1]);HOT=new Set(sc.slice(0,3).map(x=>x[0]));}
 const statHtml=p=>{const r=ST[p.id];if(!r||(r.v||0)<MIN_VIEWS)return"";return `<div class="stat"><span>${EYE}${esc(t("seen",{n:r.v}))}</span>${r.a>=3?`<span>${MSG}${esc(t("asked",{n:r.a}))}</span>`:""}</div>`;};
 function hit(id,k){try{const key="pst:"+k+":"+id;if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,"1");}catch(e){}
  try{fetch(API+"/pstats/hit",{method:"POST",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify({id,k})});}catch(e){}}
 fetch(API+"/pstats").then(r=>r.ok?r.json():{}).then(d=>{ST=d||{};hotList();render();}).catch(()=>{});
 function render(){
  document.getElementById("tabs").innerHTML=["all","cabin","semi","auto","panel","cop","floor"].map(k=>`<button type="button" class="tab" data-k="${k}" aria-pressed="${k===cur}">${esc(t(k))}</button>`).join("");
  const list=items.filter(p=>cur==="all"||p.cat===cur);
  document.getElementById("count").textContent=t("items",{n:list.length});
  document.getElementById("grid").innerHTML=list.map((p,i)=>`<div class="pc ${p.cat==="floor"?"floor":""}"><button type="button" class="img" data-i="${items.indexOf(p)}" aria-label="${esc(name(p))}">${HOT.has(p.id)?`<span class="hot">${esc(t("top"))}</span>`:""}<img src="assets/thumbs-lg/${imgId(p)}.jpg" alt="${esc(name(p))}" loading="lazy" decoding="async"></button>
   <div class="body"><span class="cat">${esc(t(p.cat))}</span><span class="name ${p.code?"code":""}"><bdi>${esc(curV(p)?t("code",{c:"\u2066"+p.code+"-"+curV(p).v+"\u2069"}):name(p))}</bdi></span><span class="desc">${esc(shortDesc(p)||colorOf(p))}</span>${p.variants?`<div class="vars" data-p="${p.id}"><span class="vl">${esc(t("colors"))}${curV(p)?": "+esc(vName(curV(p))):""}</span>${(dflt(p)>=0?p.variants.map((v,k)=>[v,k]):[[{id:p.id,ar:p.ar,label:p.label},-1],...p.variants.map((v,k)=>[v,k])]).map(([v,k])=>`<button type="button" data-k="${k}" aria-pressed="${vIdx(p)===k}" title="${esc(vName(v))}"><img src="assets/thumbs/${v.id}.jpg" alt="${esc(vName(v))}" loading="lazy"></button>`).join("")}</div>`:""}${statHtml(p)}<a class="ask" data-id="${p.id}" href="contact.html?subject=Quote&product=${encodeURIComponent(t("askMsg",{p:askName(p)}))}">${esc(t("ask"))}</a></div></div>`).join("");
 }
 document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.k;history.replaceState(null,"","?cat="+cur);render();});
 document.getElementById("grid").addEventListener("click",e=>{const ak=e.target.closest("a.ask");if(ak){hit(ak.dataset.id,"a");return;}const vb=e.target.closest(".vars button");if(vb){const id=vb.closest(".vars").dataset.p,k=+vb.dataset.k;vsel[id]=k;render();return;}
  const b=e.target.closest("button.img");if(!b)return;const p=items[+b.dataset.i];hit(p.id,"v");if(p.variants){const hasD=dflt(p)>=0;const all=[...(hasD?[]:[{id:p.id,ext:p.ext}]),...p.variants.map(v=>({id:v.id,ext:"jpg"}))];lightbox(all.map(x=>"assets/"+x.id+"."+x.ext),vIdx(p)+(hasD?0:1),name(p)+" — "+longDesc(p));return;}lightbox([p.src||("assets/"+p.id+"."+p.ext)],0,name(p)+" — "+longDesc(p));});
 render(); window.addEventListener("melsa:lang",render);
})();
</script>
