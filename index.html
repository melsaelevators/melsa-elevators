<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melsa Elevators | Engineered for elegance</title>
<meta name="description" content="Melsa Elevators designs, supplies, installs and maintains elevators for homes, buildings and businesses.">
<link rel="icon" type="image/png" href="assets/logo-mark.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#023584">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.hero{background:#fff;padding:48px 0 40px;border-bottom:1px solid var(--line);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.hero h1 em{font-style:normal;color:var(--red)}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.collage img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:#f4f5f7}
.collage img:nth-child(2){transform:translateY(-18px)}.collage img:nth-child(5){transform:translateY(-18px)}
.svc{display:flex;flex-direction:column;gap:6px}
.svc .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:22px;margin-bottom:6px}
.svc p{margin:0;color:var(--muted);font-size:14px}
.types{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.types span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;color:var(--navy);font-size:14px}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--ink)}
.prod img{width:100%;aspect-ratio:1;object-fit:contain;background:#f4f5f7;display:block}
.prod span{display:block;padding:10px 12px;font-size:13px;font-weight:700}
.cta{background:var(--navy);color:#fff;border-radius:20px;padding:34px clamp(20px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:5px solid var(--red)}
.cta h2{color:#fff;margin:0 0 6px}.cta p{margin:0;color:#c7d4ec}
.logos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.logos a{background:#fff;border:1px solid var(--line);border-radius:14px;height:110px;display:flex;align-items:center;justify-content:center;padding:12px}
.logos img{max-height:84px;max-width:100%;object-fit:contain}
@media(max-width:900px){.logos{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){.logos{grid-template-columns:repeat(3,minmax(0,1fr))}.logos a{height:90px}.logos img{max-height:66px}}
.secthead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.cta{flex-direction:column;align-items:flex-start}}
</style>

window.PAGE_T={

 ar:{title:"ميلسا للمصاعد | هندسة الأناقة",eyebrow:"هندسة الأناقة",h1:"مصممة لتناسب <em>رؤيتك.</em>",

  cta1:"اطلب عرض سعر",cta2:"احجز صيانة",cta3:"تصفح الكتالوج",svcEyebrow:"خدماتنا",svcTitle:"حلول متكاملة للمصاعد",

</head>
<body data-page="home">
<main>
 <div class="hero"><div class="wrap">
  <div>
   <div class="eyebrow" data-i18n="eyebrow">Engineered for elegance</div>
   <h1 data-i18n-html="h1">Crafted to Match <em>Your Vision.</em></h1>
   <p class="lead" data-i18n="lead"></p>

  </div>
  <div class="collage" id="collage"></div>
 </div></div>

 <section><div class="wrap">
  <div class="eyebrow" data-i18n="svcEyebrow">What we do</div><h2 data-i18n="svcTitle">Complete elevator solutions</h2>
  <div class="grid4" style="margin-top:18px">
   <div class="card svc"><div class="ic">🏗️</div><h3 data-i18n="s1"></h3><p data-i18n="s1t"></p></div>
   <div class="card svc"><div class="ic">🎨</div><h3 data-i18n="s2"></h3><p data-i18n="s2t"></p></div>
   <div class="card svc"><div class="ic">🛠️</div><h3 data-i18n="s3"></h3><p data-i18n="s3t"></p></div>
   <div class="card svc"><div class="ic">⚙️</div><h3 data-i18n="s4"></h3><p data-i18n="s4t"></p></div>
  </div>
  <h3 style="margin-top:30px" data-i18n="typesTitle">Elevators for every building</h3>
  <div class="types" id="types"></div>
 </div></section>

 <section style="background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><div class="wrap">
  <div class="secthead"><div><div class="eyebrow" data-i18n="prodEyebrow"></div><h2 data-i18n="prodTitle"></h2></div><a href="catalog.html" data-i18n="seeAll" style="font-weight:700"></a></div>
  <div class="grid4" id="prods"></div>
 </div></section>


 <section id="trust"><div class="wrap">
  <div class="secthead"><div><div class="eyebrow" data-i18n="trustEyebrow"></div><h2 data-i18n="trustTitle"></h2></div><a href="clients.html" data-i18n="trustAll" style="font-weight:700"></a></div>
  <div class="logos" id="logos"></div>
 </div></section>
 <section><div class="wrap"><div class="cta"><div><h2 data-i18n="ctaTitle"></h2><p data-i18n="ctaText"></p></div><a class="btn red" href="contact.html" data-i18n="ctaBtn"></a></div></div></section>
</main>
<script src="assets/site-data.js"></script>
<script src="assets/products.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
 const {t,esc,lang,site}=Melsa, P=window.MELSA_PRODUCTS;
 const pick=["semi_automatic_doors_02","automatic_doors_01","control_panels_04","semi_automatic_doors_05","automatic_doors_08","control_panels_02"];
 const all=Object.values(P).flat(), byId=Object.fromEntries(all.map(p=>[p.id,p]));
 document.getElementById("collage").innerHTML=pick.map(id=>`<img src="assets/thumbs/${id}.jpg" alt="" loading="lazy">`).join("");
 function render(){
  const L=lang();
  document.getElementById("types").innerHTML=["Residential","Villa","Hospital","Mall","Office","Hotel","Factory"].map(k=>`<span>${esc(t("b."+k))}</span>`).join("");
  const show=["semi_automatic_doors_03","automatic_doors_04","control_panels_01","flooring_samples_10","semi_automatic_doors_06","automatic_doors_07","control_panels_05","flooring_samples_03"];
  document.getElementById("prods").innerHTML=show.map(id=>{const p=byId[id];return `<a class="prod" href="catalog.html"><img src="assets/thumbs/${p.id}.jpg" alt="" loading="lazy"><span>${esc(p.code?t("code",{c:p.code}):(L==="ar"?p.ar:p.label))}</span></a>`}).join("");
 const cl=(site.clients||[]).filter(c=>c.logo); document.getElementById("trust").hidden=!cl.length;
  document.getElementById("logos").innerHTML=cl.slice(0,12).map(c=>`<a href="clients.html" title="${esc(L==="ar"?c.name_ar:c.name_en)}"><img src="${esc(c.logo)}" alt="${esc(L==="ar"?c.name_ar:c.name_en)}" loading="lazy"></a>`).join("");
 }
 render(); window.addEventListener("melsa:lang",render);
})();
</script>
